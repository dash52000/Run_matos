name: Diagnostic Overpass
on:
  push:
    branches: [diag-overpass]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Interroger les serveurs Overpass (zone Virton)
        run: |
          Q1='[out:json][timeout:18];way["highway"](49.550,5.500,49.590,5.570);out tags geom;'
          Q2='[out:json][timeout:60];way["highway"](49.550,5.500,49.590,5.570);out tags geom;'
          for ep in https://overpass-api.de/api/interpreter https://lz4.overpass-api.de/api/interpreter https://z.overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter https://overpass.osm.ch/api/interpreter; do
            for q in "$Q1" "$Q2"; do
              res=$(curl -s -o out.json -w '%{http_code} %{time_total}' --max-time 90 -A "RunCoachMatos-Android/1.0 (diagnostic)" -H "Accept: application/json" --data-urlencode "data=$q" "$ep" || echo "curl-fail")
              ways=$(grep -o '"type": *"way"' out.json 2>/dev/null | wc -l)
              size=$(stat -c %s out.json 2>/dev/null || echo 0)
              remark=$(grep -o '"remark"[^}]*' out.json 2>/dev/null | head -c 160)
              head=$(head -c 120 out.json 2>/dev/null | tr '\n' ' ')
              echo "::notice title=$(echo $ep | cut -d/ -f3)::timeout=$(echo $q | grep -o 'timeout:[0-9]*') http/time=$res ways=$ways bytes=$size $remark | $head"
            done
          done
